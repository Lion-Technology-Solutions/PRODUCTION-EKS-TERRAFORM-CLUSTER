apiVersion: v1
kind: Namespace
metadata:
  name: liontech-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liontech-nodeport-demo
  namespace: liontech-apps
  labels:
    app: liontech-nodeport-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: liontech-nodeport-demo
  template:
    metadata:
      labels:
        app: liontech-nodeport-demo
    spec:
      nodeSelector:
        workernode: liontech-cluster
      containers:
        - name: web
          image: public.ecr.aws/nginx/nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: liontech-nodeport-demo
  namespace: liontech-apps
spec:
  type: NodePort
  selector:
    app: liontech-nodeport-demo
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: liontech-nodeport-demo
  namespace: liontech-apps
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: liontech-nodeport-demo
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60

