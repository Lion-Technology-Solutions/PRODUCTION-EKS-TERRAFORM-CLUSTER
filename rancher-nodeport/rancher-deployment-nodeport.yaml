apiVersion: v1
kind: Namespace
metadata:
  name: cattle-system
  labels:
    app.kubernetes.io/name: rancher
    app.kubernetes.io/part-of: liontech-eks-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rancher
  namespace: cattle-system
  labels:
    app.kubernetes.io/name: rancher
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rancher-cluster-admin
  labels:
    app.kubernetes.io/name: rancher
subjects:
  - kind: ServiceAccount
    name: rancher
    namespace: cattle-system
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: rancher-bootstrap-secret
  namespace: cattle-system
  labels:
    app.kubernetes.io/name: rancher
type: Opaque
stringData:
  bootstrapPassword: "REPLACE_WITH_STRONG_PASSWORD_BEFORE_DEPLOY"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: liontech-gp3
  labels:
    app.kubernetes.io/name: rancher
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rancher-data
  namespace: cattle-system
  labels:
    app.kubernetes.io/name: rancher
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: liontech-gp3
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rancher
  namespace: cattle-system
  labels:
    app.kubernetes.io/name: rancher
    app.kubernetes.io/component: management-server
    app.kubernetes.io/part-of: liontech-eks-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: rancher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rancher
        app.kubernetes.io/component: management-server
        app.kubernetes.io/part-of: liontech-eks-platform
    spec:
      serviceAccountName: rancher
      nodeSelector:
        workernode: liontech-cluster
      securityContext:
        fsGroup: 1000
      containers:
        - name: rancher
          image: rancher/rancher:stable
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
          env:
            - name: CATTLE_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rancher-bootstrap-secret
                  key: bootstrapPassword
          volumeMounts:
            - name: rancher-data
              mountPath: /var/lib/rancher
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
              scheme: HTTP
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: true
            privileged: true
      volumes:
        - name: rancher-data
          persistentVolumeClaim:
            claimName: rancher-data
---
apiVersion: v1
kind: Service
metadata:
  name: rancher-nodeport
  namespace: cattle-system
  labels:
    app.kubernetes.io/name: rancher
    app.kubernetes.io/component: management-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rancher
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
      nodePort: 30081
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
      nodePort: 30443
